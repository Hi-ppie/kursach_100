{% extends "base.html" %}
{% block title %}Результат{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-10 offset-md-1">
    <div class="card-compact">
      <h4>Результат поиска</h4>
      <p>Найдено позиций: {{ results|length }}</p>
      <table class="table table-sm">
        <thead><tr><th>Код</th><th>Тема</th><th>Оценка</th></tr></thead>
        <tbody>
          {% for r in results %}
            <tr>
              <td>{{ r['project_id'] }}</td>
              <td>{{ r['topic'] or r['project_topic'] }}</td>
              <td>{{ r['grade'] }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
      <a class="btn btn-link" href="{{ url_for('blueprint_query.query_index', id=id) }}">Назад</a>
    </div>
  </div>
</div>
{% endblock %}
