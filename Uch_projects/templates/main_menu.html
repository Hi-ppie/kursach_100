{% extends "base.html" %}
{% block title %}Главное меню{% endblock %}
{% block content %}
<div class="row">
  <div class="col-lg-8 offset-lg-2">
    <div class="card-compact">
      <h1>Главное меню</h1>
      <p class="form-text-muted">Выберите действие</p>

      <div class="list-group mt-3">
        <a class="list-group-item list-group-item-action" href="{{ url_for('blueprint_query.query_menu') }}"><i class="bi bi-search me-2"></i>Работа с запросами</a>
        <a class="list-group-item list-group-item-action" href="{{ url_for('blueprint_report.report_menu') }}"><i class="bi bi-file-earmark-text me-2"></i>Работа с отчётами</a>
        <a class="list-group-item list-group-item-action" href="{{ url_for('blueprint_commission.create') }}"><i class="bi bi-people-fill me-2"></i>Сформировать комиссию</a>
      </div>

      <div class="mt-3">
        <a class="btn btn-outline-secondary" href="{{ url_for('exit') }}">Выход</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
