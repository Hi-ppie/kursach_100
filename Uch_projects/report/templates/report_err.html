{% extends "base.html" %}
{% block title %}Ошибка отчёта{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-8 offset-md-2">
    <div class="card-compact text-center">
      <h3>Ошибка</h3>
      <p class="text-muted">{{ message }}</p>
      <a class="btn btn-primary" href="{{ url_for('blueprint_report.report_index', id=id) }}">Вернуться к вводу</a>
      <a class="btn btn-link" href="{{ url_for('main_menu') }}">Главное меню</a>
    </div>
  </div>
</div>
{% endblock %}
