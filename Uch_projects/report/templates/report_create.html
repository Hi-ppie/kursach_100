<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Created</title>
</head>
    <body>
    <center>
        <div>
            <h2>
                Отчёт успешно создан
            </h2>
                <form action="{{ url_for('blueprint_report.report_result', id=id) }}" method="post">

                {% if id == '1' %}
                 <!-- отчёт по дате -->
                <input type="hidden" name="month" value="{{ user['month'] }}">
                 <input type="hidden" name="year" value="{{ user['year'] }}">
                    {% elif id == '2' %}
                 <!-- отчёт по преподавателю -->
                 <input type="hidden" name="teacher_id" value="{{ user['teacher_id'] }}">
                {% endif %}

                 <input type="submit" name="action" value="Посмотреть">
                </form>

                <br>
                <a href="{{ url_for('blueprint_report.report_menu') }}" method="get">Назад в меню отчётов</a>
                <br>
                <a href="{{ url_for('main_menu') }}">Главное меню</a>
        </div>
    </center>
    </body>
</html>
