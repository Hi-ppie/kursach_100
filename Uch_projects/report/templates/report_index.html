<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ввод параметров отчёта</title>
</head>
<body>
<center>

    <h2>{{ item['name'] }}</h2>

    <form action="{{ url_for('blueprint_report.report_result', id=item['id']) }}" method="post">
        <input type="hidden" name="id" value="{{ item['id'] }}">

        {% if item['type'] == 'by_date' %}
            <label for="month">Месяц</label>
            <input type="number" name="month" id="month" min="1" max="12" required>
            <br><br>

            <label for="year">Год</label>
            <input type="number" name="year" id="year" required>
            <br><br>

        {% elif item['type'] == 'by_teacher' %}
            <label for="teacher_id">ID преподавателя</label>
            <input type="number" name="teacher_id" id="teacher_id" required>
            <br><br>
        {% endif %}

        <input type="submit" name="action" value="Создать">
        <input type="submit" name="action" value="Посмотреть">
    </form>

    <br>
    <a href="{{ url_for('blueprint_report.report_menu') }}">Назад в меню отчётов</a>
    <br>
    <a href="{{ url_for('main_menu') }}">Главное меню</a>

</center>
</body>
</html>
