{% extends "base.html" %}
{% block title %}Формирование комиссии{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-10 offset-lg-1">
    <div class="card-compact">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Формирование комиссии</h3>
        <a class="btn btn-sm btn-outline-primary" href="{{ url_for('blueprint_order.schedule') }}">
          <i class="bi bi-calendar3"></i> Расписание
        </a>
      </div>

      <form id="createForm" action="{{ url_for('blueprint_order.create') }}" method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Преподаватели</label>
            <div id="teachersList" class="border rounded p-2" style="max-height:260px; overflow:auto;">
              {% for t in teachers %}
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="teacher_id" value="{{ t['teacher_id'] }}" id="t{{t['teacher_id']}}">
                <label class="form-check-label" for="t{{t['teacher_id']}}">{{ t['surname'] }} <small class="text-muted">({{ t['account_num'] }})</small></label>
              </div>
              {% endfor %}
            </div>
            <div id="busy_info" class="form-text text-warning mt-1"></div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Дисциплина</label>
            <select id="discipline_id" name="discipline_id" class="form-select" required>
              {% for d in disciplines %}
                <option value="{{ d['discipline_id'] }}">{{ d['name'] }}</option>
              {% endfor %}
            </select>

            <label class="form-label mt-3">Дата комиссии</label>
            <input id="defense_date" name="defense_date" class="form-control" type="date" required>
          </div>

          <div class="col-12">
            <label class="form-label">Проекты</label>
            <div id="projects" class="border rounded p-2" style="min-height:80px;">
              Загрузка...
            </div>
            <div id="projects_count" class="form-text text-muted mt-1"></div>
          </div>
        </div>

        <div class="mt-3 d-flex justify-content-between">
          <div>
            <a class="btn btn-link" href="{{ url_for('main_menu') }}">Главное меню</a>
          </div>
          <div>
            <button id="submitBtn" class="btn btn-primary" type="submit">Сформировать комиссию</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
/* AJAX helper + UI logic (preserves previous behavior) */
async function loadProjects() {
    const disc = document.getElementById('discipline_id').value;
    const projectsDiv = document.getElementById('projects');
    const projectsCount = document.getElementById('projects_count');
    projectsDiv.innerHTML = 'Загрузка...';
    projectsCount.textContent = '';
    try {
        const res = await fetch('{{ url_for("blueprint_order.ajax_projects") }}', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({discipline_id: disc})
        });
        if (!res.ok) throw new Error('Ошибка запроса: ' + res.status);
        const data = await res.json();
        const list = data.projects || [];
        projectsDiv.innerHTML = '';
        if (list.length === 0) {
            projectsDiv.innerHTML = '<div class="text-muted">Проекты не найдены для выбранной дисциплины</div>';
            projectsCount.textContent = 'Найдено: 0';
        } else {
            list.forEach(p => {
                const wrapper = document.createElement('div');
                wrapper.className = 'form-check mb-1';
                const dateStr = p.defense_date ? ` — ${p.defense_date}` : '';
                const already = p.has_commission ? ' <span class="text-danger">(уже назначена)</span>' : '';
                wrapper.innerHTML = `<input class="form-check-input" type="checkbox" name="project_id" value="${p.project_id}" id="p${p.project_id}">
                    <label class="form-check-label" for="p${p.project_id}">[${p.project_id}] ${escapeHtml(p.topic)} — студент: ${escapeHtml(p.student_surname)} — рук.: ${escapeHtml(p.supervisor_surname)}${dateStr}${already}</label>`;
                projectsDiv.appendChild(wrapper);
            });
            projectsCount.textContent = 'Найдено: ' + list.length;
        }
        const date = document.getElementById('defense_date').value;
        if (date) checkBusyTeachers(date);
    } catch (err) {
        projectsDiv.innerHTML = `<div class="text-danger">Ошибка при загрузке проектов: ${err.message}</div>`;
    }
}

async function checkBusyTeachers(date) {
    try {
        const res = await fetch('{{ url_for("blueprint_order.ajax_check_teachers") }}', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({defense_date: date})
        });
        if (!res.ok) throw new Error('Ошибка запроса: ' + res.status);
        const data = await res.json();
        const busy = data.busy || [];
        document.querySelectorAll('input[name="teacher_id"]').forEach(cb => {
            const id = parseInt(cb.value, 10);
            if (busy.indexOf(id) !== -1) {
                cb.disabled = true;
                cb.closest('.form-check').style.opacity = '0.5';
                cb.closest('.form-check').title = 'Этот преподаватель занят на выбранную дату';
            } else {
                cb.disabled = false;
                cb.closest('.form-check').style.opacity = '1';
                cb.closest('.form-check').title = '';
            }
        });
        const info = document.getElementById('busy_info');
        info.textContent = busy.length ? 'Некоторые преподаватели заняты в выбранную дату и отключены.' : '';
    } catch (err) {
        console.error(err);
    }
}

function escapeHtml(s) {
    if (!s && s !== 0) return '';
    return String(s).replace(/[&<>"'`=\/]/g, function (c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','/':'&#x2F;','`':'&#x60;','=':'&#x3D;'}[c];
    });
}

document.addEventListener('DOMContentLoaded', function(){
    const discEl = document.getElementById('discipline_id');
    const dateEl = document.getElementById('defense_date');
    discEl.addEventListener('change', loadProjects);
    dateEl.addEventListener('change', function(){
        const date = this.value;
        if (date) checkBusyTeachers(date);
    });
    loadProjects();
});
</script>
{% endblock %}
