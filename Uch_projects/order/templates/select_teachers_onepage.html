<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Формирование комиссии (одна страница)</title>
    <script>
    async function loadProjects() {
        const disc = document.getElementById('discipline_id').value;
        const date = document.getElementById('defense_date').value;
        const res = await fetch('{{ url_for("blueprint_order.ajax_projects") }}', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({discipline_id: disc})
        });
        const data = await res.json();
        const projectsDiv = document.getElementById('projects');
        projectsDiv.innerHTML = '';
        if (data.projects && data.projects.length) {
            data.projects.forEach(p => {
                const div = document.createElement('div');
                div.style.border = '1px solid #ccc';
                div.style.padding = '6px';
                div.style.margin = '4px';
                div.innerHTML = `<label>
                    <input type="checkbox" name="project_id" value="${p.project_id}"> [${p.project_id}] ${p.topic} — студент: ${p.student_surname} — рук.: ${p.supervisor_surname}
                    ${p.has_commission ? '<span style="color:red">(уже назначена)</span>' : ''}
                </label>`;
                projectsDiv.appendChild(div);
            });
        } else {
            projectsDiv.innerHTML = '<p>Проекты не найдены для выбранной дисциплины</p>';
        }
        // Если дата уже выбрана, запустить проверку учителей
        if (date) checkBusyTeachers(date);
    }

    async function checkBusyTeachers(date) {
        const res = await fetch('{{ url_for("blueprint_order.ajax_check_teachers") }}', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({defense_date: date})
        });
        const data = await res.json();
        const busy = data.busy || [];
        // Отключаем/подсвечиваем чекбоксы преподавателей
        document.querySelectorAll('input[name="teacher_id"]').forEach(cb => {
            if (busy.indexOf(parseInt(cb.value)) !== -1) {
                cb.disabled = true;
                cb.parentElement.style.opacity = '0.5';
                cb.parentElement.title = 'Этот преподаватель уже занят на выбранную дату';
            } else {
                cb.disabled = false;
                cb.parentElement.style.opacity = '1';
                cb.parentElement.title = '';
            }
        });
        // Покажем уведомление
        const info = document.getElementById('busy_info');
        if (busy.length) {
            info.textContent = 'Некоторые преподаватели заняты в выбранную дату и будут отключены.';
        } else {
            info.textContent = '';
        }
    }

    document.addEventListener('DOMContentLoaded', function(){
        document.getElementById('discipline_id').addEventListener('change', loadProjects);
        document.getElementById('defense_date').addEventListener('change', function(){
            const date = this.value;
            if (date) checkBusyTeachers(date);
        });
        // initial load
        loadProjects();
    });
    </script>
</head>
<body>
<center>
    <h2>Сформировать комиссию — единая страница</h2>

    <form action="{{ url_for('blueprint_order.create') }}" method="post">
        <fieldset style="border:1px solid #ccc; padding:8px; margin-bottom:8px;">
            <legend>Шаг 1. Выберите преподавателей (члены комиссии)</legend>
            {% for t in teachers %}
                <div style="margin:4px;">
                    <label>
                        <input type="checkbox" name="teacher_id" value="{{ t['teacher_id'] }}">
                        {{ t['surname'] }} ({{ t['account_num'] }})
                    </label>
                </div>
            {% endfor %}
            <div id="busy_info" style="color:orange; margin-top:6px;"></div>
        </fieldset>

        <fieldset style="border:1px solid #ccc; padding:8px; margin-bottom:8px;">
            <legend>Шаг 2. Выберите дисциплину и дату</legend>
            <label for="discipline_id">Дисциплина</label>
            <select id="discipline_id" name="discipline_id" required>
                {% for d in disciplines %}
                    <option value="{{ d['discipline_id'] }}">{{ d['name'] }}</option>
                {% endfor %}
            </select>
            <br><br>
            <label for="defense_date">Дата комиссии</label>
            <input id="defense_date" type="date" name="defense_date" required>
        </fieldset>

        <fieldset style="border:1px solid #ccc; padding:8px; margin-bottom:8px;">
            <legend>Шаг 3. Выберите проекты (студентов)</legend>
            <div id="projects">
                <!-- проекты подгружаются AJAX -->
                Загрузка...
            </div>
        </fieldset>

        <input type="submit" value="Сформировать комиссию">
    </form>

    <br>
    <a href="{{ url_for('blueprint_order.schedule') }}" target="_blank">Посмотреть общее расписание</a>
    <br><br>
    <a href="{{ url_for('main_menu') }}">Главное меню</a>
</center>
</body>
</html>
