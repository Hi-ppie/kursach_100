{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6 offset-md-3">
    <div class="card-compact">
      <h3>Вход в систему</h3>
      <form action="{{ url_for('blueprint_auth.auth_index') }}" method="post">
        <div class="mb-2">
          <label class="form-label">Логин</label>
          <input class="form-control" type="text" name="login" placeholder="Введите логин" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input class="form-control" type="password" name="passw" placeholder="Введите пароль" required>
        </div>
        <button class="btn btn-primary" type="submit">Войти</button>
        <a class="btn btn-link" href="{{ url_for('blueprint_auth.auth_exit') }}">Выход</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
